# Release on a pushed tag vX.Y.Z. .devN tags go to TestPyPI; aN, bN, rcN and finals go to PyPI.
# PyPI publishing uses trusted publishing (OIDC) — configure the "pypi" and "testpypi" environments
# and the trusted publisher on pypi.org before the first release (task SETUP-07).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      target: ${{ steps.v.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc|dev)[0-9]*$ ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
          # .devN builds rehearse on TestPyPI; alphas, betas, release candidates and finals go to PyPI.
          if [[ "$version" == *dev* ]]; then echo "target=testpypi"; else echo "target=pypi"; fi >> "$GITHUB_OUTPUT"
      - name: Test before publishing
        run: |
          uv venv && uv pip install -e ".[dev]"
          .venv/bin/pytest
          .venv/bin/python -c "import dpdpkit_conformance as c; assert c.openapi()"
      - name: Build
        run: uv build
      - name: Tag must match package version
        run: ls dist/*-${{ steps.v.outputs.version }}-*.whl
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: rm dist/sbom.spdx.json
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: rm dist/sbom.spdx.json
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish-testpypi, publish-pypi]
    if: always() && needs.build.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.build.outputs.version }}" '
            $0 ~ "^## " { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: dist/*
